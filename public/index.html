<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spire Ledger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>SPIRE LEDGER</h1>
  <span id="status">Connecting...</span>
  <span class="spacer"></span>
  <label class="btn" for="runFiles">Import run folder</label>
  <input id="runFiles" type="file" webkitdirectory directory multiple accept=".run" hidden>
  <input id="importToken" type="password" placeholder="Import key" aria-label="Import key" autocomplete="off">
  <button id="dbDownload" type="button">Download backup</button>
</header>

<main>
  <div class="controls">
    Character <select id="fChar"><option value="">All</option></select>
    Ascension <select id="fAsc"><option value="">All</option></select>
    Min sample <input id="fMin" type="number" min="1" value="1">
  </div>
  <div class="cards" id="overview"></div>
  <nav id="tabs"></nav>
  <div id="view"></div>
</main>
<script src="app.js"></script>
</body>
</html>
