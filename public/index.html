<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Solo run statistics for Slay the Spire 2." />
    <title>STS2 Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>STS2 Tracker</h1>
      <span id="status" role="status" aria-live="polite">Connecting...</span>
      <span class="spacer"></span>
      <label id="importRunButton" class="btn primary" for="runFiles" hidden
        >Import Run Folder</label
      >
      <input
        id="runFiles"
        type="file"
        webkitdirectory
        directory
        multiple
        accept=".run"
        hidden />
      <button id="signInButton" type="button">Sign in</button>
      <button id="createProfileButton" type="button" class="primary">
        Create profile
      </button>
      <button id="signOutButton" type="button" hidden>Sign out</button>
    </header>

    <section id="accountPanel" class="account-panel" hidden>
      <form id="accountForm">
        <strong id="accountTitle">Sign in</strong>
        <label
          >Username
          <input
            id="accountUsername"
            autocomplete="username"
            minlength="3"
            maxlength="24"
            required
        /></label>
        <label
          >Password
          <input
            id="accountPassword"
            type="password"
            autocomplete="current-password"
            minlength="5"
            maxlength="128"
            required
        /></label>
        <button id="accountSubmit" type="submit" class="primary">Sign in</button>
        <button id="accountSwitch" type="button" class="link"></button>
        <button id="accountClose" type="button" class="link">Cancel</button>
        <span id="accountMessage" class="hint" role="alert"></span>
      </form>
    </section>

    <main>
      <section class="scope-bar" aria-label="Whose runs to show">
        <div class="scope-switch" role="group">
          <button id="globalScope" type="button" aria-pressed="true">
            Everyone
          </button>
          <button id="profileScope" type="button" aria-pressed="false" hidden>
            My profile
          </button>
          <button
            id="otherScope"
            type="button"
            class="chip"
            aria-pressed="true"
            hidden></button>
        </div>
        <div class="profile-search">
          <input
            id="profileSearch"
            type="search"
            placeholder="Search players..."
            aria-label="Find a player's profile"
            autocomplete="off"
            maxlength="24" />
          <ul id="profileResults" class="results" hidden></ul>
        </div>
      </section>

      <div class="controls">
        <div class="char-filter">
          <span>Character</span>
          <div id="charPicker"></div>
          <input id="fChar" type="hidden" value="" />
        </div>
        <label>Ascension <select id="fAsc"></select></label>
        <label>Patch <select id="fPatch"></select></label>
        <label
          >Min sample
          <input id="fMin" type="number" min="1" max="9999" value="1"
        /></label>
        <button id="resetFilters" type="button" class="link">Reset</button>
      </div>

      <div class="cards" id="overview"></div>
      <p class="hint note">
        Abandoned runs are saved but never counted in any stat, win rate or
        total.
      </p>
      <nav id="tabs" aria-label="Statistics"></nav>
      <div id="view" aria-live="polite"></div>
    </main>

    <div id="dropOverlay" class="drop-overlay" hidden>
      Drop your .run files to import
    </div>
    <script src="trends.js"></script>
    <script src="app.js"></script>
  </body>
</html>
