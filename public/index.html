<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>STS2 TRACKER</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>STS2 TRACKER</h1>
      <span id="status">Connecting...</span>
      <span class="spacer"></span>
      <label id="importRunButton" class="btn" for="runFiles"
        >Import run folder</label
      >
      <input
        id="runFiles"
        type="file"
        webkitdirectory
        directory
        multiple
        accept=".run"
        hidden />
      <input
        id="importToken"
        type="password"
        placeholder="Admin key"
        aria-label="Admin key"
        autocomplete="off" />
      <button id="dbDownload" type="button">Download backup</button>
    </header>

    <section class="profile-bar">
      <div class="scope-switch" aria-label="Statistics scope">
        <button id="globalScope" class="on" type="button">Everyone</button>
        <button id="profileScope" type="button" disabled>My profile</button>
      </div>
      <span id="profileLabel">Combined public stats</span>
      <span class="spacer"></span>
      <button id="signInButton" type="button">Sign in</button>
      <button id="createProfileButton" type="button">Create profile</button>
      <button id="signOutButton" type="button" hidden>Sign out</button>
    </section>

    <section id="accountPanel" class="account-panel" hidden>
      <form id="accountForm">
        <label
          >Username
          <input
            id="accountUsername"
            autocomplete="username"
            minlength="3"
            maxlength="24"
            required
        /></label>
        <label
          >Password
          <input
            id="accountPassword"
            type="password"
            autocomplete="current-password"
            minlength="5"
            maxlength="128"
            required
        /></label>
        <button id="accountSubmit" type="submit">Sign in</button>
        <span id="accountMessage" class="hint" role="status"></span>
      </form>
    </section>

    <main>
      <div class="controls">
        Character
        <select id="fChar">
          <option value="">All</option>
        </select>
        Ascension
        <select id="fAsc">
          <option value="">All</option>
        </select>
        Min sample <input id="fMin" type="number" min="1" value="1" />
      </div>
      <div class="cards" id="overview"></div>
      <nav id="tabs"></nav>
      <div id="view"></div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
