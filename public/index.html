<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spire Ledger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>SPIRE LEDGER</h1>
  <span id="status">Connecting...</span>
  <span class="spacer"></span>
  <button id="settingsBtn">Run folder</button>
  <a class="btn" href="/api/export">Download database</a>
</header>

<section id="settings" hidden>
  <label>Folder containing your .run files</label>
  <div class="row">
    <input id="dirInput" type="text" placeholder="C:\Users\you\AppData\Roaming\SlayTheSpire2\...\history">
    <button id="dirSave">Save and scan</button>
  </div>
  <p class="hint">The server scans this folder and all subfolders, imports every solo run it finds, and keeps checking for new ones.
    Multiplayer runs are ignored. You can also drop .run files anywhere on this page.</p>
  <p id="settingsMsg" class="hint"></p>
</section>

<main>
  <div class="controls">
    Character <select id="fChar"><option value="">All</option></select>
    Ascension <select id="fAsc"><option value="">All</option></select>
    Min sample <input id="fMin" type="number" min="1" value="1">
  </div>
  <div class="cards" id="overview"></div>
  <nav id="tabs"></nav>
  <div id="view"></div>
</main>
<script src="app.js"></script>
</body>
</html>
